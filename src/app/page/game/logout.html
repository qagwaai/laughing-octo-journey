<div class="ops-page-container">
  <app-guarded-left-menu [playerName]="playerName()" [joinCharacter]="joinCharacter()"></app-guarded-left-menu>
  <div class="page-main">
    <h1>{{ t.game.logout.title }}</h1>
    <p class="subtitle">{{ t.game.logout.subtitle }}</p>

    @if (playerName()) {
    <p class="context">
      {{ t.common.playerPrefix }}
      <strong>{{ playerName() }}</strong>
    </p>
    }

    <section class="ops-card">
      <h2>{{ t.game.logout.sectionTitle }}</h2>
      <p>{{ t.game.logout.sectionDescription }}</p>
      @if (logoutError()) {
      <p class="logout-error" role="alert">{{ logoutError() }}</p>
      }
      <button type="button" class="logout-btn" [disabled]="isLoggingOut()" (click)="confirmLogout()">
        {{ isLoggingOut() ? t.game.logout.savingLocationLabel : t.game.logout.confirmLabel }}
      </button>
    </section>

    <section class="ops-card">
      <button type="button" class="character-list-link" [disabled]="isLoggingOut()" (click)="navigateToCharacterList()">
        {{ t.game.logout.characterListLink }}
      </button>

      <app-external-anchors class="logout-anchors"></app-external-anchors>
    </section>
  </div>
</div>
