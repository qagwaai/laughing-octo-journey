name: E2E Playwright

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── Checkout this repo (Angular front end) ──────────────────────────────
      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          path: frontend

      # ── Checkout Forge (Node server) ────────────────────────────────────────
      - name: Checkout Forge server
        uses: actions/checkout@v6
        with:
          repository: qagwaai/solid-train
          ref: main
          path: server

      # ── Node.js setup (shared version from frontend .nvmrc) ─────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json

      # ── Install dependencies ─────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # ── Install Playwright browsers ──────────────────────────────────────────
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # ── Start Forge server ───────────────────────────────────────────────────
      - name: Start Forge server
        working-directory: server
        env:
          MONGODB_URI: mongodb://localhost:27017/forge-e2e
          PORT: 3000
          NODE_ENV: test
        run: |
          npm start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Forge server to be ready
        run: |
          echo "Waiting for server on port 3000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time." >&2
          exit 1

      # ── Run Playwright E2E suite ─────────────────────────────────────────────
      - name: Run Playwright E2E suite
        working-directory: frontend
        env:
          CI: true
          API_BASE_URL: http://localhost:3000
          OPENAPI_URL: http://localhost:3000/openapi.yaml
          SOCKET_BASE_URL: http://localhost:3000
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/playwright-junit.xml
        run: npm run e2e -- --reporter=html,junit

      - name: Generate E2E summary artifact
        if: always()
        working-directory: frontend
        run: |
          node -e "const fs=require('node:fs'); const path='test-results/playwright-junit.xml'; if(!fs.existsSync(path)){console.error('Missing JUnit report at '+path); process.exit(1);} const xml=fs.readFileSync(path,'utf8'); const suites=[...xml.matchAll(/<testsuite\b[^>]*>/g)].map((m)=>m[0]); const totals={tests:0,failures:0,errors:0,skipped:0,time:0}; const readAttr=(tag,name)=>{const match=tag.match(new RegExp(name+'=\"([^\"]+)\"')); return match?Number(match[1]):0;}; for(const tag of suites){totals.tests+=readAttr(tag,'tests'); totals.failures+=readAttr(tag,'failures'); totals.errors+=readAttr(tag,'errors'); totals.skipped+=readAttr(tag,'skipped'); totals.time+=readAttr(tag,'time');} const failed=totals.failures+totals.errors; const passed=Math.max(totals.tests-failed-totals.skipped,0); const lines=['# Playwright E2E Summary','','- Total: '+totals.tests,'- Passed: '+passed,'- Failed: '+failed,'- Skipped: '+totals.skipped,'- Duration (seconds): '+totals.time.toFixed(2)]; fs.mkdirSync('test-results/summary',{recursive:true}); fs.writeFileSync('test-results/summary/e2e-summary.md',lines.join('\n')+'\n'); fs.writeFileSync('test-results/summary/e2e-summary.json',JSON.stringify({total:totals.tests,passed,failed,skipped:totals.skipped,durationSeconds:Number(totals.time.toFixed(2))},null,2)+'\n'); if(process.env.GITHUB_STEP_SUMMARY){fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');}"

      # ── Upload results ───────────────────────────────────────────────────────
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results (traces, videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 30

      - name: Upload E2E summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-summary
          path: frontend/test-results/summary/
          retention-days: 30
